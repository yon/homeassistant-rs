[package]
name = "ha-py-bridge"
description = "Home Assistant Python bridge - embeds Python interpreter for running integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "ha_py_bridge"
crate-type = ["rlib"]

[features]
# Embed Python interpreter for running Python integrations (Rust → Python)
py_bridge = ["dep:pyo3", "pyo3/auto-initialize"]

[dependencies]
async-trait = { workspace = true }
dashmap = { workspace = true }
ha-api = { workspace = true }
ha-config-entries = { workspace = true }
ha-core = { workspace = true }
ha-event-bus = { workspace = true }
ha-registries = { workspace = true }
ha-service-registry = { workspace = true }
ha-state-store = { workspace = true }
pyo3 = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = { workspace = true }
